
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: faultforge
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: faultforge
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
